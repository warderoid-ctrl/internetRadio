; Crow Hub - Elecrow CrowPanel Advance 7.0" (ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB OPI PSRAM)
; Open this folder in VS Code with the PlatformIO extension, then Build / Upload.

[platformio]
src_dir = .
default_envs = crowpanel

[env:crowpanel]
; pioarduino = Arduino-ESP32 core 3.3.x (the official PlatformIO platform is still on core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; ESP32-S3 N16R8 = 16 MB flash + 8 MB OPI PSRAM, same module as the CrowPanel
board = esp32-s3-devkitc1-n16r8
framework = arduino

; custom partitions: 6 MB app, ~9.9 MB LittleFS for photos
board_build.partitions = partitions.csv
board_upload.maximum_size = 6291456     ; = app0 partition (6 MB)
board_build.filesystem = littlefs
; Flash + PSRAM run at 80 MHz. Elecrow's factory firmware uses 120 MHz, but with the fixes below the screen is
; already rock solid at 80, and octal PSRAM at 120 MHz is "experimental" in ESP-IDF (can crash when the chip's
; temperature drifts). If the screen ever jitters again: uncomment this line and add
; CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR=y to custom_sdkconfig (the platform sets both speeds from
; f_flash, overriding custom_sdkconfig).
;board_build.f_flash = 120000000L

build_src_filter = +<*> -<.pio/> -<.git/> -<.vscode/> -<include/> -<.dummy/> -<managed_components/>
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lvgl/lvgl@9.1.0
  lovyan03/LovyanGFX@1.2.25
  jgromes/RadioLib@7.7.1
  bblanchon/ArduinoJson@^7.4.2
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7

; Arduino core rebuilt with display-friendly settings. The 800x480 RGB panel streams ~13 MB/s out of PSRAM
; non-stop, so anything that stalls PSRAM makes the picture jitter:
;  - XIP from PSRAM (code + constant data copied to PSRAM) + RGB ISR in IRAM: the panel keeps being fed while flash
;    is written (settings saves, photo uploads). This was the remaining jitter.
;  - 64-byte data cache lines (as in Elecrow's factory build), mbedTLS buffers in PSRAM.
; The SPEED_120M / FLASHFREQ_120M lines have no effect (overridden by f_flash above). They stay because the core is
; rebuilt whenever this block's text changes: any edit here = one slow (~35 min) rebuild, cached afterwards.
custom_sdkconfig =
  CONFIG_IDF_EXPERIMENTAL_FEATURES=y
  CONFIG_SPIRAM_SPEED_120M=y
  CONFIG_ESPTOOLPY_FLASHFREQ_120M=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
