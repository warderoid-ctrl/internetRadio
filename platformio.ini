; Crow Hub - Elecrow CrowPanel Advance 7.0" (ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB OPI PSRAM)
; Open this folder in VS Code with the PlatformIO extension, then Build / Upload.

[platformio]
src_dir = .
default_envs = crowpanel

[env:crowpanel]
; pioarduino = Arduino-ESP32 core 3.3.x (the official PlatformIO platform is still on core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB flash + OPI PSRAM, custom partitions (6 MB app, ~9.9 MB LittleFS for photos)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456     ; = app0 partition (6 MB)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

build_src_filter = +<*> -<.pio/> -<.git/> -<.vscode/> -<include/>
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lvgl/lvgl@9.1.0
  lovyan03/LovyanGFX@1.2.25
  jgromes/RadioLib@7.7.1
  bblanchon/ArduinoJson@^7.4.2
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
