<!doctype html>
<html lang="en">
<head>

<title>Tonal daylight home</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #EFEEE9; color: #121212; font-family: Inter, system-ui, sans-serif; padding: 20px 24px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

  <div style="flex: 1; display: grid; grid-template-columns: 316px 1fr; gap: 12px; min-height: 0">
    <div style="background: {{primary}}; color: #121212; border-radius: 36px; padding: 24px 26px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-size: 15px; font-weight: 600">Tuesday 27 October</div>
      <div style="font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 128px; line-height: 0.85; letter-spacing: -0.05em">7:42</div>
      <div style="background: rgba(18,18,18,0.1); border-radius: 22px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"></path><path d="M16 2v3"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path></svg>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 12px; font-weight: 600; opacity: 0.8">08:15 · in 33 min</span>
          <span style="font-size: 16px; font-weight: 600">[Next calendar event]</span>
        </span>
      </div>
    </div>

    <div style="display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; min-height: 0">
      <div style="background: #121212; color: #fff; border-radius: 36px; padding: 20px 26px; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 14px; font-weight: 600; color: #B5B4AE">Outside now</span>
          <span style="font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 72px; line-height: 0.9; letter-spacing: -0.04em">11°</span>
          <span style="font-size: 15px; font-weight: 500">Light rain · H 13° L 7°</span>
        </div>
        <div style="width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
        </div>
      </div>

      <div style="background: #fff; border-radius: 36px; padding: 16px; display: flex; align-items: center; gap: 16px">
        <div style="width: 116px; height: 116px; border-radius: 28px; background: #EFEEE9; color: #121212; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box; flex-shrink: 0">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"></path><path d="M19.075 4.933a10 10 0 0 1 0 14.134"></path><path d="M4.925 19.067a10 10 0 0 1 0-14.134"></path><path d="M7.753 16.239a6 6 0 0 1 0-8.478"></path><circle cx="12" cy="12" r="2"></circle></svg>
          <span style="font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">NTS 1</span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <div>
            <div style="font-size: 13px; color: #6B6A65; font-weight: 500">Playing · Live from London</div>
            <div style="font-size: 20px; font-weight: 600; margin-top: 2px">NTS Radio 1</div>
          </div>
          <div style="display: flex; gap: 8px">
            <button aria-label="Previous station" style="width: 56px; height: 48px; border-radius: 24px; border: 0; background: #EFEEE9; color: #121212; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"></path><path d="M3 20V4"></path></svg></button>
            <button aria-label="Pause" style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #121212; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></svg></button>
            <button aria-label="Next station" style="width: 56px; height: 48px; border-radius: 24px; border: 0; background: #EFEEE9; color: #121212; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v16"></path><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"></path></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="height: 76px; background: #fff; border-radius: 38px; padding: 8px; display: flex; align-items: center; gap: 4px; box-sizing: border-box">
    <a href="#" style="height: 60px; padding: 0 22px; border-radius: 30px; background: #E2E1DB; color: #121212; text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M3 12h18"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>Today</a>
    <a href="#" aria-label="Radio" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"></path><path d="M19.075 4.933a10 10 0 0 1 0 14.134"></path><path d="M4.925 19.067a10 10 0 0 1 0-14.134"></path><path d="M7.753 16.239a6 6 0 0 1 0-8.478"></path><circle cx="12" cy="12" r="2"></circle></svg></a>
    <a href="TonalDay-Podcast.dc.html" aria-label="Podcasts" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v4"></path><path d="M18 11a6 6 0 00-3-5.197"></path><path d="M2 11a10 10 0 015-8.662"></path><path d="M22 11a10 10 0 00-5-8.662"></path><path d="M6 11a6 6 0 013-5.197"></path><path d="M9 21h6"></path><rect x="10" y="9" width="4" height="8" rx="2"></rect></svg></a>
    <a href="TonalDay-Weather.dc.html" aria-label="Weather" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path></svg></a>
    <a href="#" aria-label="Home Assistant" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="#" aria-label="Timers" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"></line><line x1="12" x2="15" y1="14" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg></a>
    <a href="#" aria-label="Photos" style="flex: 1; height: 60px; border-radius: 30px; color: #6B6A65; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></a>
    <button aria-label="Talk to the hub" style="width: 92px; height: 60px; border-radius: 20px; border: 0; background: #121212; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#FF6B3D","options":["#FF6B3D","#FFC145","#5CB8FF","#3DDC97"]},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#FF6B3D' };
  }
}
</script>
</body>
</html>
